[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stablediff"
version = "0.1.0"
description = "CLI tools to fine-tune Stable Diffusion with LoRA and generate images."
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "diffusers>=0.27",
    "transformers>=4.40",
    "accelerate>=0.30",
    "peft>=0.10",
    "safetensors>=0.4",
    "Pillow>=10",
    "tqdm>=4.66",
    "numpy>=1.24",
]

[project.scripts]
stablediff-train = "stablediff.train:main"
stablediff-generate = "stablediff.generate:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: loads models and runs training (slow, needs GPU).",
    "slow: long-running test.",
]
